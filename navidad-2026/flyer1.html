<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Navidad - CLSEM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer; /* Indica que se puede hacer clic/tocar */
            -webkit-tap-highlight-color: transparent; /* Evita el destello azul al tocar en móviles */
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        /* Indicador discreto de estado del audio */
        #estado-audio {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 13px;
            pointer-events: none; /* Para que el toque pase directo al flyer */
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- Reemplaza con el nombre exacto de tu imagen -->
    <img src="flyer1.jpeg" alt="Feliz Navidad CLSC">

    <!-- Reemplaza con el nombre exacto de tu archivo MP3 -->
    <audio id="gaita" src="musica-fondo.mp3" loop preload="auto"></audio>

    <div id="estado-audio">🎵 Preparando música...</div>

    <script>
        const audio = document.getElementById('gaita');
        const indicador = document.getElementById('estado-audio');
        let sonando = false;
        let temporizador;

        function reproducir() {
            audio.play().then(() => {
                sonando = true;
                indicador.textContent = '🔊 Toca el flyer para silenciar';
            }).catch(() => {
                // Si el navegador móvil bloqueó el autoplay a los 5 segundos:
                sonando = false;
                indicador.textContent = '🔇 Toca el flyer para escuchar la gaita';
            });
        }

        function silenciar() {
            audio.pause();
            sonando = false;
            indicador.textContent = '🔇 Silenciado (toca para activar)';
        }

        // 1. Intentar reproducir automáticamente a los 5 segundos (5000 ms)
        temporizador = setTimeout(() => {
            if (!sonando) {
                reproducir();
            }
        }, 5000);

        // 2. Control al tocar o hacer clic en cualquier parte de la pantalla
        document.body.addEventListener('click', () => {
            clearTimeout(temporizador); // Cancela los 5s si el usuario tocó antes
            if (sonando) {
                silenciar();
            } else {
                reproducir();
            }
        });
    </script>
</body>
</html>
